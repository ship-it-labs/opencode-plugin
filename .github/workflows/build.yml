name: Platform build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Control plane build id
        required: true
        type: string
      install_commands:
        description: JSON array of install commands
        required: false
        default: '[]'
        type: string
      build_commands:
        description: JSON array of build commands
        required: true
        type: string
      test_commands:
        description: JSON array of test commands
        required: false
        default: '[]'
        type: string
      source_url:
        description: Signed URL of the uploaded project archive
        required: false
        default: ''
        type: string
      source_sha256:
        description: Expected SHA-256 of the project archive
        required: false
        default: ''
        type: string
      checkout_url:
        description: Fallback repository to check out when no upload is provided
        required: false
        default: ''
        type: string
      checkout_ref:
        description: Branch, tag or commit to check out
        required: false
        default: ''
        type: string
      language:
        description: Project language (node, python, go, cpp, c, rust, java, ruby, elixir). Empty means detect from the sources.
        required: false
        default: ''
        type: string
      run_command:
        description: Command that starts the built project inside the runtime sandbox
        required: false
        default: ''
        type: string
      build_env:
        description: JSON object of build-time environment variables (never logged, never stored)
        required: false
        default: '{}'
        type: string

concurrency:
  group: build-${{ inputs.build_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ${{ inputs.build_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      exit_code: ${{ steps.result.outputs.exit_code }}
      status: ${{ steps.result.outputs.status }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Parse command inputs
        id: parse
        env:
          INSTALL_COMMANDS: ${{ inputs.install_commands }}
          BUILD_COMMANDS: ${{ inputs.build_commands }}
          TEST_COMMANDS: ${{ inputs.test_commands }}
        run: |
          set -euo pipefail
          echo "install=$(jq -c 'if type=="array" then . else [] end' <<< "$INSTALL_COMMANDS")" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -c 'if type=="array" then . else [] end' <<< "$BUILD_COMMANDS")" >> "$GITHUB_OUTPUT"
          echo "test=$(jq -c 'if type=="array" then . else [] end' <<< "$TEST_COMMANDS")" >> "$GITHUB_OUTPUT"

      - name: Download uploaded project
        if: ${{ inputs.source_url != '' }}
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          # This fetch is the build's front door: a cold control plane answering
          # 502 here fails the whole build, so retry through the warm-up window.
          curl -fsSL --retry 8 --retry-delay 5 --retry-max-time 120 \
            --retry-all-errors --retry-connrefused -o project.zip "$SOURCE_URL"

          if [ -n "$SOURCE_SHA256" ]; then
            actual="$(sha256sum project.zip | awk '{print $1}')"
            if [ "$actual" != "$SOURCE_SHA256" ]; then
              echo "::error::Archive checksum mismatch. expected=$SOURCE_SHA256 actual=$actual"
              exit 1
            fi
            echo "Archive verified: $actual"
          fi

      - name: Extract project
        if: ${{ inputs.source_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q project.zip -d project
          # Archives produced by the plugin can contain a single top level
          # directory; flatten it so install_commands see the project root.
          if [ "$(find project -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "project/$(ls project)" ]; then
            mv "project/$(ls project)"/* project/ 2>/dev/null || true
            rmdir "project/$(ls project)" 2>/dev/null || true
          fi
          echo "Extracted $(find project -type f | wc -l) files"

      - name: Checkout project
        if: ${{ inputs.source_url == '' && inputs.checkout_url != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_url }}
          ref: ${{ inputs.checkout_ref }}
          path: project
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Verify source is present
        run: |
          set -euo pipefail
          if [ ! -d project ] || [ -z "$(ls -A project 2>/dev/null)" ]; then
            echo "::error::No source available. Provide source_url from project_upload, or checkout_url."
            exit 1
          fi

      - name: Detect runtime
        id: detect
        working-directory: project
        run: |
          set -euo pipefail
          # The control plane resolves the language the same way and passes it
          # in; detection here is the fallback for older dispatches that omit it.
          if [ -n "${{ inputs.language }}" ]; then
            echo "ecosystem=${{ inputs.language }}" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "ecosystem=node" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "ecosystem=python" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then
            echo "ecosystem=go" >> "$GITHUB_OUTPUT"
          elif [ -f Cargo.toml ]; then
            echo "ecosystem=rust" >> "$GITHUB_OUTPUT"
          elif [ -f mix.exs ]; then
            echo "ecosystem=elixir" >> "$GITHUB_OUTPUT"
          elif [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "ecosystem=java" >> "$GITHUB_OUTPUT"
          elif [ -f Gemfile ]; then
            echo "ecosystem=ruby" >> "$GITHUB_OUTPUT"
          elif [ -f CMakeLists.txt ] || [ -f Makefile ] || ls *.cpp *.cc 1>/dev/null 2>&1; then
            echo "ecosystem=cpp" >> "$GITHUB_OUTPUT"
          else
            echo "ecosystem=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Mask and export build environment
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          # Values arrive as plain input text, so GitHub does not mask them
          # automatically. Register every value as a secret mask first, then
          # export — in that order, so nothing leaks in between.
          while IFS= read -r value; do
            [ -z "$value" ] && continue
            masked="$(printf '%s' "$value" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
            echo "::add-mask::$masked"
          done < <(jq -r '.[]' <<< "$BUILD_ENV" 2>/dev/null || true)
          while IFS="=" read -r name value; do
            [ -z "$name" ] && continue
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$BUILD_ENV" 2>/dev/null || true)
          echo "Exported $(jq 'length' <<< "$BUILD_ENV" 2>/dev/null || echo 0) build variables (values masked)."

      - name: Set up pinned Node toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'node' }}
        run: |
          set -euo pipefail
          # Must match server-agent/internal/toolchain NodeVersion. The runner
          # image ships its own node, but the bundle needs a pinned,
          # relocatable copy that travels with the app.
          NODE_VERSION="24.21.0"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            -o node-toolchain.tar.xz
          mkdir -p "$RUNNER_TEMP/node-toolchain"
          tar -xJf node-toolchain.tar.xz -C "$RUNNER_TEMP/node-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/node-toolchain/bin" >> "$GITHUB_PATH"
          node --version
          echo "NODE_TOOLCHAIN=$RUNNER_TEMP/node-toolchain" >> "$GITHUB_ENV"

      # Pinned toolchain versions live in server-agent/internal/toolchain and
      # are mirrored here. Bump both together; the agent validates the language
      # while this workflow installs the matching toolchain.
      - name: Set up pinned Go toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'go' }}
        run: |
          set -euo pipefail
          GO_VERSION="1.27"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o go-toolchain.tar.gz
          mkdir -p "$RUNNER_TEMP/go-toolchain"
          tar -xzf go-toolchain.tar.gz -C "$RUNNER_TEMP/go-toolchain"
          echo "$RUNNER_TEMP/go-toolchain/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go version

      - name: Set up pinned Python toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'python' }}
        run: |
          set -euo pipefail
          # Relocatable CPython: the same layout ships inside the bundle, so
          # the interpreter the build used is the interpreter the sandbox runs.
          PY_VERSION="3.13.5"
          PY_TAG="20250814"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-${PY_VERSION}+${PY_TAG}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz" \
            -o python-toolchain.tar.gz
          mkdir -p "$RUNNER_TEMP/python-toolchain"
          tar -xzf python-toolchain.tar.gz -C "$RUNNER_TEMP/python-toolchain"
          echo "$RUNNER_TEMP/python-toolchain/python/bin" >> "$GITHUB_PATH"
          echo "PYTHON_TOOLCHAIN=$RUNNER_TEMP/python-toolchain/python" >> "$GITHUB_ENV"
          python3 --version || python --version
          python3 -m ensurepip --default-pip 2>/dev/null || python -m ensurepip --default-pip 2>/dev/null || true

      - name: Set up pinned C/C++ toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'cpp' || steps.detect.outputs.ecosystem == 'c' }}
        run: |
          set -euo pipefail
          # musl.cc native toolchain: static-capable gcc with no root needed.
          # Versionless upstream; the build log records the gcc version for
          # traceability instead.
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://musl.cc/x86_64-linux-musl-native.tgz" -o musl-toolchain.tgz
          mkdir -p "$RUNNER_TEMP/musl-toolchain"
          tar -xzf musl-toolchain.tgz -C "$RUNNER_TEMP/musl-toolchain" --strip-components=1
          echo "$RUNNER_TEMP/musl-toolchain/bin" >> "$GITHUB_PATH"
          echo "CC=$RUNNER_TEMP/musl-toolchain/bin/gcc" >> "$GITHUB_ENV"
          gcc --version | head -1

      - name: Set up Rust toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'rust' }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version && cargo --version

      - name: Set up Java toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Set up Elixir toolchain
        if: ${{ steps.detect.outputs.ecosystem == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            project/node_modules
            ~/.npm
            ~/.cache/pnpm
            ~/.cache/yarn
            ~/.cache/pip
          key: ${{ runner.os }}-build-${{ inputs.build_id }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Run install, build and test commands
        id: result
        env:
          INSTALL_COMMANDS: ${{ steps.parse.outputs.install }}
          BUILD_COMMANDS: ${{ steps.parse.outputs.build }}
          TEST_COMMANDS: ${{ steps.parse.outputs.test }}
        working-directory: project
        run: |
          set -uo pipefail
          status="success"
          exit_code=0

          run_stage() {
            local stage="$1"
            local commands="$2"
            echo "::group::${stage}"
            while IFS= read -r cmd; do
              [ -z "$cmd" ] && continue
              echo "\$ $cmd"
              set +e
              eval "$cmd" 2>&1
              code=$?
              set -e
              if [ $code -ne 0 ]; then
                echo "::endgroup::"
                echo "STAGE=${stage} EXIT_CODE=$code"
                return $code
              fi
            done < <(jq -r '.[]' <<< "$commands")
            echo "::endgroup::"
            return 0
          }

          run_stage "install" "$INSTALL_COMMANDS" || exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            run_stage "build" "$BUILD_COMMANDS" || exit_code=$?
          fi
          if [ "$exit_code" -eq 0 ]; then
            run_stage "test" "$TEST_COMMANDS" || exit_code=$?
          fi

          if [ "$exit_code" -ne 0 ]; then
            status="failure"
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Bundle node runtime
        id: bundle
        if: ${{ success() && steps.detect.outputs.ecosystem == 'node' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # A self-contained bundle the sandbox runs without any toolchain of
          # its own: the pinned node binary, the built app with its
          # node_modules, and an entry manifest saying how to start it.
          rm -rf bundle && mkdir -p bundle/app bundle/node
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git
          cp -r "$NODE_TOOLCHAIN/." bundle/node/
          jq -n \
            --arg language "node" \
            --arg run_command "$RUN_COMMAND" \
            --arg node_version "24.21.0" \
            '{language: $language, run_command: $run_command, toolchain: {node: $node_version}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip node app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle python runtime
        id: bundle-python
        if: ${{ success() && steps.detect.outputs.ecosystem == 'python' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          rm -rf bundle && mkdir -p bundle/app bundle/python
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git bundle/app/__pycache__
          cp -r "$PYTHON_TOOLCHAIN/." bundle/python/
          jq -n \
            --arg language "python" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {python: "3.13.5"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip python app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle go runtime
        id: bundle-go
        if: ${{ success() && steps.detect.outputs.ecosystem == 'go' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # Static binary lives inside app/ (built by the AI's build commands
          # with CGO_ENABLED=0); no interpreter ships.
          rm -rf bundle && mkdir -p bundle/app bundle/runtime
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git
          jq -n \
            --arg language "go" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {go: "1.27"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip runtime app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle cpp/c runtime
        id: bundle-cpp
        if: ${{ success() && (steps.detect.outputs.ecosystem == 'cpp' || steps.detect.outputs.ecosystem == 'c') }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
          ECOSYSTEM: ${{ steps.detect.outputs.ecosystem }}
        run: |
          set -euo pipefail
          # Same shape as go: the compiled binary is inside app/.
          rm -rf bundle && mkdir -p bundle/app bundle/runtime
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git
          jq -n \
            --arg language "$ECOSYSTEM" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {cc: "musl-native"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip runtime app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle rust runtime
        id: bundle-rust
        if: ${{ success() && steps.detect.outputs.ecosystem == 'rust' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # target/ is huge: ship sources plus the release binaries only.
          rm -rf bundle && mkdir -p bundle/app bundle/app/bin bundle/runtime
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git bundle/app/target
          if [ -d project/target/release ]; then
            find project/target/release -maxdepth 1 -type f -executable \
              -exec cp {} bundle/app/bin/ \;
          fi
          jq -n \
            --arg language "rust" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {rust: "stable"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip runtime app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle java runtime
        id: bundle-java
        if: ${{ success() && steps.detect.outputs.ecosystem == 'java' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # Ship a JRE with the app: the sandbox has no Java of its own.
          rm -rf bundle && mkdir -p bundle/app bundle/jre
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git bundle/app/target bundle/app/build
          find project -maxdepth 2 \( -path '*/target/*.jar' -o -path '*/build/libs/*.jar' -o -name '*.jar' \) -type f \
            -exec cp {} bundle/app/ \; 2>/dev/null || true
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse" \
            -o jre.tar.gz
          tar -xzf jre.tar.gz -C bundle/jre --strip-components=1
          JAVA_VERSION="$(bundle/jre/bin/java -version 2>&1 | head -1)"
          jq -n \
            --arg language "java" \
            --arg run_command "$RUN_COMMAND" \
            --arg java "$JAVA_VERSION" \
            '{language: $language, run_command: $run_command, toolchain: {java: $java}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip jre app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle ruby runtime
        id: bundle-ruby
        if: ${{ success() && steps.detect.outputs.ecosystem == 'ruby' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # Ship the interpreter setup-ruby installed: the sandbox has none.
          rm -rf bundle && mkdir -p bundle/app bundle/ruby
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git
          RUBY_PREFIX="$(dirname "$(dirname "$(command -v ruby)")")"
          cp -r "$RUBY_PREFIX/." bundle/ruby/
          jq -n \
            --arg language "ruby" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {ruby: "3.4"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip ruby app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Bundle elixir runtime
        id: bundle-elixir
        if: ${{ success() && steps.detect.outputs.ecosystem == 'elixir' }}
        env:
          RUN_COMMAND: ${{ inputs.run_command }}
        run: |
          set -euo pipefail
          # Prefer an OTP release (erts included, self-booting); fall back to
          # the full app dir when the AI did not cut one.
          rm -rf bundle && mkdir -p bundle/app bundle/release
          cp -r project/. bundle/app/
          rm -rf bundle/app/.git bundle/app/_build bundle/app/deps
          if [ -d project/_build/prod/rel ]; then
            cp -r project/_build/prod/rel/. bundle/release/
          fi
          jq -n \
            --arg language "elixir" \
            --arg run_command "$RUN_COMMAND" \
            '{language: $language, run_command: $run_command, toolchain: {elixir: "1.18", otp: "27"}, created: now | todate}' \
            > bundle/entry.json
          (cd bundle && zip -qr ../bundle.zip release app entry.json)
          sha256sum bundle.zip | awk '{print $1}' > bundle.sha256
          stat -c%s bundle.zip > bundle.size
          echo "Bundle: $(cat bundle.size) bytes, sha $(cat bundle.sha256)"

      - name: Upload runtime bundle
        if: ${{ success() && hashFiles('bundle.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ inputs.build_id }}
          path: |
            bundle.zip
            bundle.sha256
            bundle.size
          retention-days: 7
          if-no-files-found: error

      - name: Deliver bundle to control plane
        if: ${{ success() && hashFiles('bundle.zip') != '' }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
          REPORT_TOKEN: ${{ secrets.BUILD_REPORT_TOKEN }}
          REPORT_URL: ${{ vars.PLATFORM_API_URL }}
        run: |
          set -euo pipefail
          # The control plane streams the bundle to the running runtime's host
          # when one is live; otherwise it stores the bundle in platform
          # storage so a later start can fetch it (the GitHub artifact below
          # stays as the CI-side backup). Text fields precede the file
          # part — the control plane consumes the body in arrival order.
          if [ -z "$REPORT_TOKEN" ] || [ -z "$REPORT_URL" ]; then
            echo "::notice::No report credentials, skipping bundle delivery"
            exit 0
          fi
          # A cold or restarting control plane answers 502 for up to a minute,
          # so retry long and hard before giving up on the bundle. The response
          # body names the real code (UPSTREAM_UNAVAILABLE vs STORE_FAILED vs
          # a token problem), so it is always printed — a bare 502 with the
          # body discarded is undiagnosable.
          resp_body="$(mktemp)"
          if curl -fsS -o "$resp_body" --retry 8 --retry-delay 5 --retry-max-time 120 \
            --retry-all-errors --retry-connrefused \
            -X POST "$REPORT_URL/api/v1/builds/$BUILD_ID/bundle" \
            -H "x-build-report-token: $REPORT_TOKEN" \
            -F "github_repo=$GITHUB_REPOSITORY" \
            -F "github_run_id=$GITHUB_RUN_ID" \
            -F "file=@bundle.zip;type=application/zip"; then
            echo "Delivered runtime bundle to the control plane: $(cat "$resp_body")"
          else
            echo "::warning::Could not deliver the bundle; runtimes will use the source archive. Response: $(cat "$resp_body")"
          fi
          rm -f "$resp_body"

      - name: Package build output
        if: always()
        id: checksum
        run: |
          set -uo pipefail
          cd project
          dirs=()
          for d in dist build out .next target release; do
            [ -d "$d" ] && dirs+=("$d")
          done
          for f in $(ls *.tar.gz *.zip 2>/dev/null); do
            cp "$f" ../artifact-payload.tar.gz 2>/dev/null || true
          done
          if [ ${#dirs[@]} -gt 0 ]; then
            tar -czf ../artifact-payload.tar.gz "${dirs[@]}" 2>/dev/null || true
          fi
          cd ..
          if [ -f artifact-payload.tar.gz ]; then
            sha256sum artifact-payload.tar.gz | awk '{print $1}' > artifact.sha256
            stat -c%s artifact-payload.tar.gz > artifact.size
          else
            echo "" > artifact.sha256
            echo "0" > artifact.size
          fi

      - name: Upload build artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.build_id }}
          path: |
            artifact-payload.tar.gz
            artifact.sha256
            artifact.size
          retention-days: 7
          if-no-files-found: ignore

      - name: Report result
        if: always()
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXIT_CODE: ${{ steps.result.outputs.exit_code }}
          STATUS: ${{ steps.result.outputs.status }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          REPORT_TOKEN: ${{ secrets.BUILD_REPORT_TOKEN }}
          REPORT_URL: ${{ vars.PLATFORM_API_URL }}
          # `gh` refuses to read a run log without a token, and the workflow
          # token is the only one with actions:read here.
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Build $BUILD_ID"
            echo ""
            echo "- status: ${STATUS:-timeout}"
            echo "- exit_code: ${EXIT_CODE:-1}"
            echo "- artifact_sha256: ${SHA256}"
            echo "- workflow_run_id: ${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Without this the build stays "running" on the dashboard forever and
          # its output is only readable here on github.com. Never fail the step
          # over a reporting problem: the build result is already decided.
          if [ -z "$REPORT_TOKEN" ] || [ -z "$REPORT_URL" ]; then
            echo "::notice::BUILD_REPORT_TOKEN or PLATFORM_API_URL is unset, skipping the build report"
            exit 0
          fi

          log_file="$RUNNER_TEMP/build.log"
          # --log is not available while the job is still running, so a failure
          # here just means we report status without output.
          gh run view "$GITHUB_RUN_ID" --log > "$log_file" 2>/dev/null || \
            echo "(log unavailable for this run)" > "$log_file"

          payload="$RUNNER_TEMP/report.json"
          jq -n \
            --arg status "${STATUS:-timeout}" \
            --argjson exit_code "${EXIT_CODE:-1}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --rawfile log "$log_file" \
            '{
              status: $status,
              exit_code: $exit_code,
              workflow_run_id: $run_id,
              logs: (
                $log
                | split("\n")
                | map(select(length > 0))
                | map({stream: "stdout", content: .})
              )
            }' > "$payload"

          if curl -fsS --retry 8 --retry-delay 5 --retry-max-time 120 \
            --retry-all-errors --retry-connrefused \
            -X POST "$REPORT_URL/api/v1/builds/$BUILD_ID/report" \
            -H "x-build-report-token: $REPORT_TOKEN" \
            -H "content-type: application/json" \
            --data-binary "@$payload" > /dev/null; then
            echo "Reported build result to the control plane."
          else
            echo "::warning::Could not report the build result; the dashboard will time this build out."
          fi
          exit 0
